<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpg" href="/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ayojon Provides you a full service of event management">
    <title>Ayojon Event Management Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background-color:#F8F5F2;z-index:9999;">
        <div style="display:flex;flex-direction:column;align-items:center;">
           <div style="width:40px;height:40px;border:3px solid rgba(106,13,173,0.1);border-top-color:#6A0DAD;border-radius:50%;animation:spin 1s linear infinite;"></div>
           <div style="margin-top:16px;color:#6A0DAD;font-family:sans-serif;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;font-size:10px;">Loading...</div>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
